name: Deploy to GitHub Pages

# Исходники живут в main, собранный сайт публикуется в ветку gh-pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # чтобы пушить в gh-pages

# не запускаем два деплоя одновременно; новый ждёт, а не отменяет текущий
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          # адрес Worker'а анкеты: Settings → Secrets and variables → Actions → Variables → DATE_ENDPOINT
          VITE_DATE_ENDPOINT: ${{ vars.DATE_ENDPOINT }}

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: 'Deploy ${{ github.sha }}'
